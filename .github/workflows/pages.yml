name: pages
# Every push to main that touches the content or site/ rebuilds index.html from projects.yaml and deploys the page to Cloudflare Pages (colefoster-site.pages.dev).
on:
  push:
    branches: [main]
    paths: ["projects.yaml", "build.py", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml==6.0.3 && python3 build.py
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name colefoster-site --branch main
